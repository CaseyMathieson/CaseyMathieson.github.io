<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc">
  <title id="title">Stage-quality test flow</title>
  <desc id="desc">A test workflow progresses from motion and probe acquisition through data-quality checks, analysis, and result review.</desc>
  <rect width="840" height="360" fill="#0c1012"/>
  <g font-family="Segoe UI, sans-serif"><text x="40" y="43" fill="#edf2f4" font-size="17" font-weight="700">Stage-quality test flow</text><text x="40" y="68" fill="#74828a" font-size="13">Runout, wobble, noise, and data-quality review</text></g>
  <g fill="#101416" stroke="#293137" stroke-width="1.5"><rect x="41" y="124" width="150" height="132" rx="3"/><rect x="235" y="124" width="150" height="132" rx="3"/><rect x="429" y="124" width="150" height="132" rx="3"/><rect x="623" y="124" width="176" height="132" rx="3"/></g>
  <g font-family="Segoe UI, sans-serif">
    <g fill="#7dcfff" font-size="11" font-weight="700" letter-spacing="1.1"><text x="60" y="153">01 · ACQUIRE</text><text x="254" y="153">02 · CHECK</text><text x="448" y="153">03 · ANALYZE</text><text x="642" y="153">04 · REVIEW</text></g>
    <g fill="#edf2f4" font-size="16" font-weight="700"><text x="60" y="184">Motion + probes</text><text x="254" y="184">Data quality</text><text x="448" y="184">Signal analysis</text><text x="642" y="184">Recorded result</text></g>
    <g fill="#9eabb1" font-size="12"><text x="60" y="212">runout + noise</text><text x="60" y="231">controlled motion</text><text x="254" y="212">saturation review</text><text x="254" y="231">triggered slices</text><text x="448" y="212">align + filter</text><text x="448" y="231">radial + frequency</text><text x="642" y="212">plots + storage</text><text x="642" y="231">repeatable review</text></g>
  </g>
  <g fill="none" stroke="#43c4ff" stroke-width="2"><path d="M192 190H233M386 190H427M580 190H621"/><path d="M227 184L234 190L227 196M421 184L428 190L421 196M615 184L622 190L615 196"/></g>
  <path d="M40 310H800" stroke="#293137"/><text x="40" y="338" fill="#74828a" font-family="Segoe UI, sans-serif" font-size="12">Controls migration · data-quality checks · repeatable analysis</text>
</svg>
